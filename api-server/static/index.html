<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureChat - Encrypted Messaging</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Schermata Login/Registrazione -->
    <div id="auth-screen" class="screen active">
        <div class="auth-container">
            <div class="auth-header">
                <h1>SecureChat</h1>
                <p>End-to-end encrypted messaging platform</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login"><span>Login</span></button>
                <button class="tab-btn" data-tab="register"><span>Register</span></button>
            </div>
            
            <!-- Login Form -->
            <form id="login-form" class="auth-form active">
                <div class="form-group">
                    <input type="text" id="login-username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
                <div id="login-error" class="error-message"></div>
            </form>
            
            <!-- Register Form -->
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <input type="text" id="register-username" placeholder="Username" required>
                </div>
                <div class="form-group">
                    <input type="password" id="register-password" placeholder="Password" required>
                </div>
                <div class="form-group">
                    <input type="password" id="register-password-confirm" placeholder="Confirm Password" required>
                </div>
                <button type="submit" class="btn btn-primary">Create Account</button>
                <div id="register-error" class="error-message"></div>
            </form>
        </div>
    </div>
    
    <!-- Schermata Chat -->
    <div id="chat-screen" class="screen">
        <div class="chat-container">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="user-info">
                        <div class="user-avatar" id="user-avatar-sidebar">U</div>
                        <span id="current-user-name">User</span>
                    </div>
                    <button id="logout-btn" class="btn-icon" title="Logout">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
                
                <div class="chat-list">
                    <div class="chat-item active" data-chat="broadcast">
                        <div class="chat-avatar">G</div>
                        <div class="chat-info">
                            <div class="chat-name">General</div>
                            <div class="chat-preview">Public messages</div>
                        </div>
                    </div>
                </div>
                
                <div class="sidebar-footer">
                    <div class="online-users">
                        <div class="online-header">
                            <span>Online Users</span>
                            <span id="online-count">0</span>
                        </div>
                        <div id="online-users-list"></div>
                    </div>
                </div>
            </div>
            
            <!-- Main Chat Area -->
            <div class="chat-main">
                <div class="chat-header">
                    <div class="chat-avatar">G</div>
                    <div class="chat-header-info">
                        <h3 id="chat-title">General Chat</h3>
                        <p id="chat-subtitle">End-to-end encrypted</p>
                    </div>
                </div>
                
                <div id="messages-container" class="messages-container">
                    <!-- I messaggi verranno inseriti qui -->
                </div>
                
                <div id="typing-indicator" class="typing-indicator">
                    <div class="typing-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span class="typing-text"></span>
                </div>
                
                <div class="chat-input-container">
                    <div class="chat-input-wrapper">
                        <input type="file" id="image-input" accept="image/*" style="display: none;">
                        <button class="btn-icon" id="attach-btn" title="Attach image">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                            </svg>
                        </button>
                        <input 
                            type="text" 
                            id="message-input" 
                            placeholder="Type a message..."
                            autocomplete="off"
                        >
                        <button id="send-btn">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2" fill="white"></polygon>
                            </svg>
                        </button>
                    </div>
                    <div class="chat-hint" id="dm-hint"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast per notifiche -->
    <div id="toast-container"></div>
    
    <script src="/static/app.js"></script>
</body>
</html>
